<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Adina & Daniel — invitație</title>
  <meta name="description" content="Invitație de nuntă cu parallax, tranziții line și fundal continuu." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-back"></div>
  <div class="ambient ambient-mid"></div>
  <div class="ambient ambient-light"></div>

  <div class="global-floaters" aria-hidden="true">
    <span class="leaf lf1"></span><span class="leaf lf2"></span><span class="leaf lf3"></span><span class="leaf lf4"></span>
    <span class="petal pf1"></span><span class="petal pf2"></span><span class="petal pf3"></span><span class="petal pf4"></span>
    <span class="spark sf1"></span><span class="spark sf2"></span><span class="spark sf3"></span>
  </div>

  <main class="story">
    <div class="viewport-shell">
      <div class="stage-stack">
        <figure class="stage stage-1" data-stage>
          <img class="layer base" src="assets/pages/page-1-sharp.png" alt="Adina și Daniel - scena 1" />
          <img class="layer sides" src="assets/layers/scene-1-sides.png" alt="" aria-hidden="true" />
          <img class="layer canopy" src="assets/layers/scene-1-canopy.png" alt="" aria-hidden="true" />
          <img class="layer foreground" src="assets/layers/scene-1-foreground.png" alt="" aria-hidden="true" />
          <div class="inner-floaters" aria-hidden="true">
            <span class="leaf a"></span><span class="leaf b"></span><span class="petal c"></span><span class="petal d"></span><span class="spark e"></span>
          </div>
        </figure>

        <figure class="stage stage-2" data-stage>
          <img class="layer base" src="assets/pages/page-2-sharp.png" alt="Adina și Daniel - scena 2" />
          <img class="layer sides" src="assets/layers/scene-2-sides.png" alt="" aria-hidden="true" />
          <img class="layer canopy" src="assets/layers/scene-2-canopy.png" alt="" aria-hidden="true" />
          <img class="layer foreground" src="assets/layers/scene-2-foreground.png" alt="" aria-hidden="true" />
          <div class="inner-floaters" aria-hidden="true">
            <span class="leaf a"></span><span class="leaf b"></span><span class="petal c"></span><span class="petal d"></span><span class="spark e"></span>
          </div>
        </figure>

        <figure class="stage stage-3 text-scene" data-stage>
          <img class="layer base" src="assets/pages/page-3.webp" alt="Programul evenimentelor" />
          <img class="layer sides" src="assets/layers/scene-3-sides.png" alt="" aria-hidden="true" />
          <img class="layer canopy" src="assets/layers/scene-3-canopy.png" alt="" aria-hidden="true" />
          <img class="layer foreground" src="assets/layers/scene-3-foreground.png" alt="" aria-hidden="true" />
          <div class="text-softener" aria-hidden="true"></div>
          <div class="inner-floaters quiet" aria-hidden="true">
            <span class="leaf a"></span><span class="petal c"></span><span class="spark e"></span>
          </div>
        </figure>

        <figure class="stage stage-4 text-scene" data-stage>
          <img class="layer base" src="assets/pages/page-4.webp" alt="Confirmare prezență și culori" />
          <img class="layer sides" src="assets/layers/scene-4-sides.png" alt="" aria-hidden="true" />
          <img class="layer canopy" src="assets/layers/scene-4-canopy.png" alt="" aria-hidden="true" />
          <img class="layer foreground" src="assets/layers/scene-4-foreground.png" alt="" aria-hidden="true" />
          <div class="text-softener" aria-hidden="true"></div>
          <div class="inner-floaters quiet" aria-hidden="true">
            <span class="leaf a"></span><span class="petal c"></span><span class="spark e"></span>
          </div>
        </figure>
      </div>
    </div>

    <aside class="progress" aria-label="Capitole">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </aside>

    <section class="chapter"></section>
    <section class="chapter"></section>
    <section class="chapter"></section>
    <section class="chapter"></section>
</main>

  <script src="script.js"></script>
</body>
</html>
