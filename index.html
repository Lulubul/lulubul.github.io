<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Adina & Daniel — invitație</title>
  <meta name="description" content="9 august Nunta si Botez" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-back"></div>
  <div class="global-floaters" aria-hidden="true">
    <span class="leaf lf1"></span><span class="leaf lf2"></span><span class="leaf lf3"></span><span class="leaf lf4"></span>
    <span class="petal pf1"></span><span class="petal pf2"></span><span class="petal pf3"></span><span class="petal pf4"></span>
    <span class="spark sf1"></span><span class="spark sf2"></span><span class="spark sf3"></span>
  </div>

  <button class="audio-toggle" id="audio-toggle" aria-label="Comută muzica">
    <span class="note-icon">♫</span>
  </button>

  <main class="story">
    <div class="entry-veil" id="entry-veil">
      <button class="entry-btn" id="entry-btn" type="button" aria-label="Pornește experiența"></button>
    </div>

    <div class="viewport-shell">
      <div class="stage-stack">
        <figure class="stage stage-1" data-stage>
          <img class="layer base" src="assets/pages/1.png" alt="Adina și Daniel - scena 1" />
          <div class="inner-floaters" aria-hidden="true">
            <span class="leaf a"></span><span class="leaf b"></span><span class="petal c"></span><span class="petal d"></span><span class="spark e"></span>
          </div>
        </figure>

        <figure class="stage stage-2" data-stage>
          <img class="layer base" src="assets/pages/2.png" alt="Adina și Daniel - scena 2" />
          <div class="inner-floaters" aria-hidden="true">
            <span class="leaf a"></span><span class="leaf b"></span><span class="petal c"></span><span class="petal d"></span><span class="spark e"></span>
          </div>
        </figure>

        <figure class="stage stage-3 text-scene" data-stage>
          <img class="layer base" src="assets/pages/3.png" alt="Programul evenimentelor" />
          <div class="text-softener" aria-hidden="true"></div>
          <div class="inner-floaters quiet" aria-hidden="true">
            <span class="leaf a"></span><span class="petal c"></span><span class="spark e"></span>
          </div>
        </figure>

        <figure class="stage stage-4 text-scene" data-stage>
          <img class="layer base" src="assets/pages/4.png" alt="Confirmare prezență și culori" />
          <div class="text-softener" aria-hidden="true"></div>
          <div class="inner-floaters quiet" aria-hidden="true">
            <span class="leaf a"></span><span class="petal c"></span><span class="spark e"></span>
          </div>
        </figure>
      </div>
    </div>

    <aside class="progress" aria-label="Capitole">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </aside>

    <section class="chapter"></section>
    <section class="chapter"></section>
    <section class="chapter"></section>
    <section class="chapter"></section>

    <div class="mobile-nav" aria-label="Navigare capitole">
      <button class="nav-btn prev" type="button" aria-label="Capitol anterior">‹</button>
      <button class="nav-btn next" type="button" aria-label="Capitol următor">›</button>
    </div>

    

    <audio id="background-audio" loop preload="auto" playsinline webkit-playsinline style="display:none">
      <source src="https://hai-la-nunta.com/assets/audio/audio.mp3" type="audio/mpeg" />
      Muzica de fundal nu este suportată de browser.
    </audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
